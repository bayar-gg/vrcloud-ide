name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behaviour is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mock-ups, examples and references to other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: Editor / realtime sync
        - label: Terminals / Run button
        - label: AI agent
        - label: Browser automation
        - label: Computer use / Remote desktop
        - label: Install / update / CLI
        - label: Other
