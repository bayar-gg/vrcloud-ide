<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="VRCloud IDE - a persistent, realtime, AI-powered IDE on your own server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.28" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="0.6" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2f6feb" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow1)"/>
  <rect width="1280" height="420" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(96 118)">
    <rect width="184" height="184" rx="48" fill="url(#g)" filter="url(#shadow)"/>
    <rect width="184" height="184" rx="48" fill="url(#gloss)"/>
    <g transform="translate(20 20) scale(6)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 19a4.5 4.5 0 0 0 .4-9A6.5 6.5 0 0 0 5.4 8.6 4 4 0 0 0 6 16.5"/>
      <path d="M8 19h9.5"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="336" y="188" font-size="78" font-weight="700" letter-spacing="-2" fill="#e6edf3">VRCloud<tspan fill="#4da3ff" font-weight="600"> IDE</tspan></text>
    <text x="340" y="236" font-size="26" font-weight="500" fill="#a9b8cc">A persistent, realtime, AI-powered IDE that runs on your own server.</text>

    <!-- Feature pills -->
    <g transform="translate(340 268)" font-size="15" font-weight="600" fill="#cfe0f5">
      <g><rect width="92" height="32" rx="16" fill="#152238" stroke="#24456e"/><text x="46" y="21" text-anchor="middle">Editor</text></g>
      <g transform="translate(102 0)"><rect width="108" height="32" rx="16" fill="#152238" stroke="#24456e"/><text x="54" y="21" text-anchor="middle">Terminals</text></g>
      <g transform="translate(220 0)"><rect width="72" height="32" rx="16" fill="#152238" stroke="#24456e"/><text x="36" y="21" text-anchor="middle">Git</text></g>
      <g transform="translate(302 0)"><rect width="110" height="32" rx="16" fill="#152238" stroke="#24456e"/><text x="55" y="21" text-anchor="middle">AI Agent</text></g>
      <g transform="translate(422 0)"><rect width="146" height="32" rx="16" fill="#1a2a52" stroke="#3358a8"/><text x="73" y="21" text-anchor="middle" fill="#8fc0ff">Computer Use</text></g>
      <g transform="translate(578 0)"><rect width="164" height="32" rx="16" fill="#152238" stroke="#24456e"/><text x="82" y="21" text-anchor="middle">Remote Desktop</text></g>
    </g>

    <text x="340" y="346" font-size="16" fill="#6f8199">Single Node.js process &#183; No database &#183; No build step &#183; Linux, Windows &amp; macOS</text>
  </g>

  <!-- Version tag -->
  <g transform="translate(1120 40)" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <rect width="120" height="34" rx="17" fill="#0f2a1c" stroke="#1f6f45"/>
    <text x="60" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#3fb950">v3.0</text>
  </g>
</svg>
